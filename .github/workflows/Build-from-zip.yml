name: Build apps from zip
on:
  push:
  workflow_dispatch:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Unzip project
        shell: bash
        run: python -m zipfile -e gba-lan-web.zip . || python3 -m zipfile -e gba-lan-web.zip .
      - name: Install
        shell: bash
        working-directory: gba-lan
        run: npm install
      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        shell: bash
        working-directory: gba-lan
        run: node scripts/fixpeer.js && npx electron-builder --publish never --win nsis zip
      - name: Build Linux packages
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        working-directory: gba-lan
        run: node scripts/fixpeer.js && npx electron-builder --publish never --linux AppImage deb
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: |
            gba-lan/dist/*.exe
            gba-lan/dist/*.zip
            gba-lan/dist/*.AppImage
            gba-lan/dist/*.deb
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Unzip project
        run: python3 -m zipfile -e gba-lan-web.zip .
      - run: npm install
        working-directory: gba-lan
      - run: npx cap sync android
        working-directory: gba-lan
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: gba-lan/android
      - uses: actions/upload-artifact@v4
        with:
          name: GBA-Link-Party-android
          path: gba-lan/android/app/build/outputs/apk/debug/app-debug.apk
          
